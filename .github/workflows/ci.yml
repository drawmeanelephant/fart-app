# CI: build + test the fart-app / kujamba instrument on Linux and macOS (#25).
#
# Pins Zig via direct tarball downloads from ziglang.org (checksum-verified) —
# no third-party setup action. Both jobs run the same steps; the Linux job
# keeps the check context name `build-test` and additionally proves the fart
# app itself runs on Linux (`fart kujamba`, silent mode when the runner has no
# audio player).
#
# Merge gate (#27): main's "Protect main" ruleset requires exactly these two
# check contexts, and nothing else —
#   {"type":"required_status_checks","parameters":{
#     "required_status_checks":[{"context":"build-test"},{"context":"demo-e2e"}],
#     "strict_required_status_checks_policy":false}}
# (the REST API's parameter key is `required_status_checks`; the ruleset web
# UI's export spells it `required_checks` — the API shape is what is live)
# Context names are the job `name:` fields below, verified against real check
# runs before the flip. `demo-e2e` needs `build-test-macos`, so the macOS unit
# suites gate merges transitively without their own required context.
# `strict=false` on purpose: the gate judges each PR's own head, and forcing
# branch-up-to-date would only add rebase churn to a one-agent-at-a-time lane.
# Flipped after the job went 18-for-18 green across every completed run since
# it landed (skips, where an earlier job failed first, don't count either way).
#
# Steps per OS:
#   zig build                              (Debug)
#   zig build test                         (audit, synth, golden, fart glue,
#                                           kujamba + vendored NINJAM, fuzz corpus)
#   zig build test -Doptimize=ReleaseSafe  (same suites, safe-mode semantics)
#   zig build -Doptimize=ReleaseSafe       (the installed binaries the smoke runs)
#   smoke: kujamba render -> check-ogg, the silence negative control must FAIL
#
# build-test-windows covers the same steps minus the demo (the demo needs the
# reference ninjamsrv build, which stays POSIX). The Winsock port that makes
# it possible is #25's Windows work: `net.zig` keeps a real sys seam
# (WSAStartup/WSAPoll/ioctlsocket on Windows, std.posix elsewhere) rather than
# faking POSIX on top of Windows.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provisioning failure-path tests
        run: python3 -m unittest discover -s demo -p 'test_*.py' -v

      - name: Install Zig (direct tarball from ziglang.org)
        run: |
          set -euo pipefail
          tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          url="https://ziglang.org/download/${ZIG_VERSION}/${tarball}"
          echo "downloading $url"
          curl -fsSL "$url" -o "$tarball"
          # checksum from https://ziglang.org/download/index.json
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball"
          echo "${GITHUB_WORKSPACE}/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: zig version
        run: zig version

      - name: zig build
        run: zig build

      - name: zig build test
        run: zig build test

      - name: zig build test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: zig build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: smoke — kujamba runs on this OS (ReleaseSafe binaries)
        run: |
          set -euo pipefail
          ./zig-out/bin/kujamba render --phrase "kujamba karibu" --out /tmp/smoke.ogg --seed 1
          ./zig-out/bin/kujamba check-ogg /tmp/smoke.ogg
          ./zig-out/bin/kujamba encode-silence /tmp/silence.ogg
          if ./zig-out/bin/kujamba check-ogg /tmp/silence.ogg; then
            echo "negative control should have failed: silence passed check-ogg"
            exit 1
          fi
          echo "kujamba smoke ok"

      - name: smoke — the fart app runs on Linux
        run: |
          set -euo pipefail
          # no audio player on the runner: the probe puts the butt in silent
          # mode, which is exactly the graceful path #25 requires
          ./zig-out/bin/fart kujamba karibu > /dev/null
          echo "fart smoke ok"

  build-test-macos:
    name: build-test-macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provisioning failure-path tests
        run: python3 -m unittest discover -s demo -p 'test_*.py' -v

      - name: Install Zig (direct tarball from ziglang.org)
        run: |
          set -euo pipefail
          tarball="zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          url="https://ziglang.org/download/${ZIG_VERSION}/${tarball}"
          echo "downloading $url"
          curl -fsSL "$url" -o "$tarball"
          # checksum from https://ziglang.org/download/index.json
          echo "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  ${tarball}" | shasum -a 256 -c -
          tar -xf "$tarball"
          echo "${GITHUB_WORKSPACE}/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: zig version
        run: zig version

      - name: zig build
        run: zig build

      - name: zig build test
        run: zig build test

      - name: zig build test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: zig build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: smoke — kujamba runs on this OS (ReleaseSafe binaries)
        run: |
          set -euo pipefail
          ./zig-out/bin/kujamba render --phrase "kujamba karibu" --out /tmp/smoke.ogg --seed 1
          ./zig-out/bin/kujamba check-ogg /tmp/smoke.ogg
          ./zig-out/bin/kujamba encode-silence /tmp/silence.ogg
          if ./zig-out/bin/kujamba check-ogg /tmp/silence.ogg; then
            echo "negative control should have failed: silence passed check-ogg"
            exit 1
          fi
          echo "kujamba smoke ok"

  build-test-windows:
    name: build-test-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig (direct tarball from ziglang.org)
        shell: bash
        run: |
          set -euo pipefail
          tarball="zig-x86_64-windows-${ZIG_VERSION}.zip"
          url="https://ziglang.org/download/${ZIG_VERSION}/${tarball}"
          echo "downloading $url"
          curl -fsSL "$url" -o "$tarball"
          # checksum from https://ziglang.org/download/index.json
          echo "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e  ${tarball}" | sha256sum -c -
          unzip -q -o "$tarball"
          echo "${GITHUB_WORKSPACE}/zig-x86_64-windows-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: zig version
        shell: bash
        run: zig version

      - name: zig build
        shell: bash
        run: zig build

      - name: zig build test
        shell: bash
        run: zig build test

      - name: zig build test (ReleaseSafe)
        shell: bash
        run: zig build test -Doptimize=ReleaseSafe

      - name: zig build (ReleaseSafe)
        shell: bash
        run: zig build -Doptimize=ReleaseSafe

      - name: smoke — kujamba runs on this OS (ReleaseSafe binaries)
        shell: bash
        run: |
          set -euo pipefail
          ./zig-out/bin/kujamba render --phrase "kujamba karibu" --out /tmp/smoke.ogg --seed 1
          ./zig-out/bin/kujamba check-ogg /tmp/smoke.ogg
          ./zig-out/bin/kujamba encode-silence /tmp/silence.ogg
          if ./zig-out/bin/kujamba check-ogg /tmp/silence.ogg; then
            echo "negative control should have failed: silence passed check-ogg"
            exit 1
          fi
          echo "kujamba smoke ok"

      - name: smoke — the fart app runs on Windows
        shell: bash
        run: |
          set -euo pipefail
          # no afplay/say on the runner: the probe puts the butt in silent
          # mode, which is exactly the graceful path #25 requires
          ./zig-out/bin/fart kujamba karibu > /dev/null
          echo "fart smoke ok"

  demo-e2e:
    name: demo-e2e
    needs: build-test-macos
    # #27: the live reference-server demo gates merges — kujamba joins the
    # UNMODIFIED reference ninjamsrv, refpeer (reference client core) receives
    # and decodes, determinism re-run + negative control, per demo/run_demo.sh.
    # Runs after the unit-test job; the reference build (checkout, ninjamsrv,
    # client core, refpeer) is cached on the resolved SHA + verified build
    # inputs. #58 separates restore failure from a miss, and only network
    # provisioning gets bounded retries. Compile/demo failures stay red.
    # No restore-keys fallback on purpose: a stale reference binary under a
    # new SHA would test the wrong server and still look green.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      KUJ_RUNTIME: ${{ github.workspace }}/demo-runtime
      KUJ_EVIDENCE_DIR: ${{ github.workspace }}/demo-runtime/evidence/run-${{ github.run_id }}-${{ github.run_attempt }}
      KUJ_EVIDENCE_INITIALIZED: "1"
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize current-run evidence
        run: python3 demo/provision_reference.py init --evidence "$KUJ_EVIDENCE_DIR"

      - name: Install Zig (direct tarball from ziglang.org)
        run: |
          set -euo pipefail
          tarball="zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          url="https://ziglang.org/download/${ZIG_VERSION}/${tarball}"
          echo "downloading $url"
          curl -fsSL "$url" -o "$tarball"
          # checksum from https://ziglang.org/download/index.json
          echo "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  ${tarball}" | shasum -a 256 -c -
          tar -xf "$tarball"
          echo "${GITHUB_WORKSPACE}/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Compute reference build cache key
        id: refkey
        run: |
          set -euo pipefail
          python3 demo/provision_reference.py resolve --evidence "$KUJ_EVIDENCE_DIR"

      - name: Restore reference build
        id: refcache
        # A restore error is not a test failure. Record it and take the same
        # bounded cold path as a miss; provisioning must still succeed.
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@v4
        with:
          path: demo-runtime/reference-cache
          key: ${{ steps.refkey.outputs.key }}

      - name: Provision and verify the pinned reference
        id: provision
        env:
          NINJAM_REF_SHA: ${{ steps.refkey.outputs.sha }}
          CACHE_RESTORE_OUTCOME: ${{ steps.refcache.outcome }}
          CACHE_HIT: ${{ steps.refcache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          python3 demo/provision_reference.py provision --evidence "$KUJ_EVIDENCE_DIR" \
            --runtime "$KUJ_RUNTIME" --sha "$NINJAM_REF_SHA" \
            --cache-directory "$KUJ_RUNTIME/reference-cache" \
            --cache-outcome "$CACHE_RESTORE_OUTCOME" --cache-hit "$CACHE_HIT"

      - name: Save only verified reference builds
        if: steps.provision.outputs.cache-ready == 'true' && steps.refcache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/save@v4
        with:
          # Must exactly match restore's path (cache versions include paths).
          path: demo-runtime/reference-cache
          key: ${{ steps.refkey.outputs.key }}

      - name: Run the live demo (gates merges, #27)
        env:
          NINJAM_REF_SHA: ${{ steps.refkey.outputs.sha }}
        run: bash demo/run_demo.sh

      - name: Finalize current-run failure receipt
        if: always() && (failure() || cancelled())
        run: |
          if [ -f "$KUJ_EVIDENCE_DIR/receipt.json" ]; then
            python3 demo/provision_reference.py phase --evidence "$KUJ_EVIDENCE_DIR" \
              --phase ci --status failed
          fi

      - name: Upload demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.KUJ_EVIDENCE_DIR }}/
          if-no-files-found: warn
          retention-days: 14
